name: Handle Assignment Action

# Triggered directly from your phone: tapping "Done" or "Snooze" in an ntfy
# notification sends an HTTPS request straight to GitHub's API, which fires
# this workflow — no server of your own needed in between.
on:
  repository_dispatch:
    types: [assignment_done, assignment_snooze, assignments_bulk_done]

jobs:
  handle-action:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the updated state.json back to the repo
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update state.json
        env:
          COMMAND: ${{ github.event.action }}
          ASSIGNMENT_ID: ${{ github.event.client_payload.id }}
          ASSIGNMENT_IDS: ${{ join(github.event.client_payload.ids, ',') }}
          SNOOZE_HOURS: ${{ github.event.client_payload.snooze_hours }}
        run: python handle_action.py

      - name: Commit updated state.json
        run: |
          git config user.name "canvas-daily-text-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update state via ntfy action: ${{ github.event.action }} [skip ci]"
          git push
