name: Daily Canvas Assignment Notifications

on:
  schedule:
    # 14:54 UTC = 10:54 AM Eastern Daylight Time, every day
    - cron: "54 14 * * *"
    # 01:06 UTC Monday = 9:06 PM Eastern Daylight Time on Sunday
    # (crosses midnight UTC, so the weekday here is Monday, not Sunday)
    - cron: "6 1 * * 1"
    # NOTE: these times are Eastern DAYLIGHT time (EDT, UTC-4). When clocks
    # fall back to EST (UTC-5) in November, both times will effectively run
    # an hour later locally (e.g. 10:54 AM becomes 11:54 AM) until you shift
    # the UTC hours below by +1, or shift them back forward again next spring.
  workflow_dispatch: {}  # lets you manually trigger a run from the Actions tab to test

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit updated state.json back to the repo
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run assignment check and send notifications
        env:
          CANVAS_ICS_URL: ${{ secrets.CANVAS_ICS_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANVAS_ANNOUNCEMENT_FEEDS: ${{ secrets.CANVAS_ANNOUNCEMENT_FEEDS }}
        run: python check_assignments.py

      - name: Commit updated state.json
        run: |
          git config user.name "canvas-daily-text-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update assignment state [skip ci]"
          git push
