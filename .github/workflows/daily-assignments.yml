name: Daily Canvas Assignment Text

on:
  schedule:
    # 11:00 UTC = 7:00 AM Eastern Daylight Time (adjust for your timezone/DST)
    - cron: "0 11 * * *"
  workflow_dispatch: {}  # lets you manually trigger a run from the Actions tab to test

jobs:
  send-text:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit updated state.json back to the repo
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run assignment check and send text
        env:
          CANVAS_ICS_URL: ${{ secrets.CANVAS_ICS_URL }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_AUTH: ${{ secrets.TWILIO_AUTH }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python check_assignments.py

      - name: Commit updated state.json
        run: |
          git config user.name "canvas-daily-text-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update assignment state [skip ci]"
          git push
